name: Private extraction checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - run: npm run check
      - run: npm run build:catalogue
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run pack
      - run: npm run test:consumer
      - run: npm run audit:a11y
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-verification-evidence
          path: |
            audit/*results.json
            audit/browser-artifacts
            audit/*.png
            audit/consumer-*.log
          retention-days: 14
    # No deployment, upload to a public site, registry credentials or publish job.
